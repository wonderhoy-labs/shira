name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      # To sign with your own key, add the repository secrets SHIRA_KEYSTORE_BASE64, SHIRA_KEYSTORE_PASSWORD,
      # SHIRA_KEY_ALIAS and SHIRA_KEY_PASSWORD. Without them the APK uses a throwaway debug key, so each build
      # has to be installed fresh instead of updating. The site carries this APK, so it matters there too.
      - name: Build the app
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.SHIRA_KEYSTORE_BASE64 }}
          SHIRA_KEYSTORE_PASSWORD: ${{ secrets.SHIRA_KEYSTORE_PASSWORD }}
          SHIRA_KEY_ALIAS: ${{ secrets.SHIRA_KEY_ALIAS }}
          SHIRA_KEY_PASSWORD: ${{ secrets.SHIRA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export SHIRA_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:lintRelease :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shira-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test and build the web app
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # Set the repository variable PUBLISH_SITE to true, and GitHub Actions as the Pages source, to run this.
  site:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_SITE == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Runs for a tag such as v0.1.0, which has to match the VERSION file.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shira-apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "v$(cat VERSION)" != "$TAG" ]; then
            echo "The tag $TAG doesn't match VERSION, which says $(cat VERSION)." >&2
            exit 1
          fi
          mv app-release.apk "shira-$TAG.apk"
          sha256sum -- shira-*.apk > SHA256SUMS
          gh release create "$TAG" --title "Shira ${TAG#v}" --verify-tag --generate-notes -- shira-*.apk SHA256SUMS
