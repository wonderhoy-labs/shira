name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: wonderhoy-labs/.github/.github/workflows/checks.yml@main

  # The app has no native code, so one APK runs on every Android CPU.
  android:
    uses: wonderhoy-labs/.github/.github/workflows/android.yml@main
    with:
      name: shira
      env-prefix: SHIRA
      gradle-tasks: >-
        spotlessCheck :tunnel:testDebugUnitTest :tunnel:lintRelease :tunnel:assembleRelease
        :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:lintRelease :app:assembleRelease
      library-files: tunnel/build/outputs/aar/tunnel-release.aar
    secrets:
      KEYSTORE_BASE64: ${{ secrets.SHIRA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.SHIRA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.SHIRA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SHIRA_KEY_PASSWORD }}

  # The site carries the APK, and installs it on the phone.
  web:
    needs: android
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: wonderhoy-labs/.github/.github/workflows/web.yml@main
    with:
      apk-artifact: shira-apk
      library: shira

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, android, web]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: wonderhoy-labs/.github/.github/workflows/release.yml@main
    with:
      title: Shira
